name: CI

on:
  pull_request:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alocasenac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alocasenac_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/alocasenac_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ruff
        run: python -m ruff check .
      - name: Tests and coverage
        run: >-
          python -m pytest -o addopts=""
          --cov=app --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=json:coverage.json
      - name: Enforce separate line and branch coverage targets
        run: >-
          python -c "import json,sys; totals=json.load(open('coverage.json', encoding='utf-8'))['totals']; lines=100*totals['covered_lines']/totals['num_statements'] if totals['num_statements'] else 100; branches=100*totals['covered_branches']/totals['num_branches'] if totals['num_branches'] else 100; print(f'Lines: {lines:.2f}% (required 80%); branches: {branches:.2f}% (required 70%)'); sys.exit(0 if lines >= 80 and branches >= 70 else 1)"
      - name: Check SonarCloud secret
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: SonarCloud scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
