name: Quality gates

on:
  push:
    branches: [principal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-coverage:
    name: Tests and 85% coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite and coverage gate
        run: >-
          pytest
          --cov=app_config
          --cov=api_v1
          --cov=domain_rules
          --cov=errors
          --cov=models
          --cov=services
          --cov-fail-under=85
          --cov-report=term-missing
          --cov-report=xml:docs/qualidade/evidencias/coverage.xml
          --cov-report=json:docs/qualidade/evidencias/coverage.json
          --junitxml=docs/qualidade/evidencias/pytest.xml
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-coverage-evidence
          path: docs/qualidade/evidencias/
          if-no-files-found: warn
          retention-days: 30

  container-tests:
    name: PostgreSQL Testcontainers (CT-19/CT-20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run PostgreSQL integration tests
        run: >-
          pytest -m integration
          --junitxml=docs/qualidade/evidencias/testcontainers.xml
      - name: Upload container-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testcontainers-evidence
          path: docs/qualidade/evidencias/testcontainers.xml
          if-no-files-found: warn
          retention-days: 30

  bdd:
    name: BDD traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate report and verify CT mapping
        run: |
          python scripts/generate_coverage_report.py
          pytest -q tests/bdd/test_gherkin_coverage.py --junitxml=docs/qualidade/evidencias/bdd.xml
      - name: Upload BDD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bdd-coverage-evidence
          path: |
            docs/qualidade/relatorio-cobertura.md
            docs/qualidade/evidencias/bdd.xml
          if-no-files-found: warn
          retention-days: 30

  static-analysis:
    name: Static security analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install 'bandit[toml]>=1.7,<2'
      - name: Run Bandit
        run: >-
          bandit -lll
          -f json
          -o docs/qualidade/evidencias/bandit.json
          api_v1.py app_config.py domain_rules.py errors.py main.py models.py services.py
      - name: Upload Bandit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-evidence
          path: docs/qualidade/evidencias/bandit.json
          if-no-files-found: warn
          retention-days: 30

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install 'pip-audit>=2.7,<3'
      - name: Audit runtime and development dependencies
        run: >-
          pip-audit -r requirements-dev.txt
          --format=json
          --output=docs/qualidade/evidencias/pip-audit.json
      - name: Upload dependency-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-evidence
          path: docs/qualidade/evidencias/pip-audit.json
          if-no-files-found: warn
          retention-days: 30

  docker-build:
    name: Build application image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag alocasenac-ci:${{ github.sha }} .
      - name: Verify non-root runtime user
        run: test "$(docker image inspect alocasenac-ci:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"