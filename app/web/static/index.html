<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — AlocaSenac</title>
  <link rel="stylesheet" href="/app/estilo.css">
  <script src="/app/app.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="panel" aria-labelledby="page-title">
      <h1 id="page-title">AlocaSenac</h1>
      <p>Entre para consultar recursos e gerenciar suas reservas.</p>
      <form id="login-form" novalidate>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="message" role="alert" hidden></p>
        <button type="submit">Entrar</button>
      </form>
    </section>
  </main>
</body>
</html>
