[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alocasenac"
version = "0.1.0"
description = "Academic reservation system backbone aligned with the PRD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "sqlalchemy==2.0.35",
  "psycopg[binary]>=3.2.10,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
test = [
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "pytest-bdd==7.3.0",
  "testcontainers[postgres]==4.8.2",
  "httpx==0.27.2",
  "ruff==0.6.9",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-q -m 'not integration'"
markers = [
  "integration: requires a PostgreSQL test database",
  "concorrencia: exercises concurrent reservation behavior",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".aiox-core", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I"]
